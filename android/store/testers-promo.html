<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Imagen "Buscamos testers", cuadrada (1080×1080). Se renderiza a PNG con Playwright. Estilos en testers-promo.css. -->
<link rel="stylesheet" href="testers-promo.css">
<style>
  :root { --w: 1080px; --h: 1080px; --top-y: 52px; --wr-h: 96px; --copy-y: 196px; --copy-w: 560px; --h1: 80px; --sub-gap: 30px; --sub: 22px; --steps-gap: 40px; --step-w: 470px; --step-gap: 18px; --step-h: 70px; --num: 40px; --step-font: 18px; --phone-x: 690px; --phone-y: 190px; --phone-w: 360px; --brand-y: 50px; --brand-w: 210px; }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="diamonds"></div>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <!-- Espacio libre arriba para pegar el logo de Wild Rift a mano. -->

  <div class="phone-wrap"><div class="phone"><img src="screenshots/dashboard-screen.png" alt=""></div></div>

  <div class="copy">
    <h1>Buscamos<span>testers</span></h1>
    <p class="sub">Prueba Rift Deck antes que nadie. Registra tus partidas de Wild Rift, mira tus estadísticas, plantéate objetivos, recibe builds recomendadas y mucho más.</p>
    <div class="steps">
      <div class="step"><div class="num">1</div><span>Únete a Rift Deck Testers</span></div>
      <div class="step"><div class="num">2</div><span>Acepta ser tester en Google</span></div>
      <div class="step"><div class="num">3</div><span>Instala Rift Deck desde Play Store</span></div>
    </div>
  </div>

  <div class="brand"><img src="../../src/assets/riftdeck-logo.png" alt=""></div>
</body>
</html>
