<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Imagen "Buscamos testers", feed vertical de Instagram (1080×1350). Se renderiza a PNG con Playwright. Estilos en testers-promo.css. -->
<link rel="stylesheet" href="testers-promo.css">
<style>
  :root { --w: 1080px; --h: 1350px; --top-y: 62px; --wr-h: 120px; --copy-y: 262px; --copy-w: 600px; --h1: 82px; --sub-gap: 44px; --sub: 28px; --steps-gap: 64px; --step-w: 530px; --step-gap: 26px; --step-h: 82px; --num: 44px; --step-font: 20px; --phone-x: 742px; --phone-y: 250px; --phone-w: 400px; --brand-y: 62px; --brand-w: 300px; }

<body>
  <div class="rays"></div>

  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <!-- Espacio libre arriba para pegar el logo de Wild Rift a mano. -->

  <div class="phone-wrap"><div class="phone"><img src="screenshots/dashboard-screen.png" alt=""></div></div>

  <div class="copy">
    <h1>Buscamos<span>testers</span></h1>

    <div class="steps">
      <div class="step"><div class="num">1</div><span>Únete a Rift Deck Testers</span></div>
      <div class="step"><div class="num">2</div><span>Acepta ser tester en Google</span></div>
      <div class="step"><div class="num">3</div><span>Instala Rift Deck desde Play Store</span></div>
    </div>
  </div>

  <div class="brand"><img src="../../src/assets/riftdeck-logo.png" alt=""></div>
