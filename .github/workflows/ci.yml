# CI: en cada push y pull request a main corre lint, paridad de traducciones, tests
# unitarios, el build de producción (con prerender) y los smoke tests e2e.
#
# Requiere dos secretos del repo (Settings > Secrets and variables > Actions):
#   VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY (los mismos de .env.local; la anon key
#   es pública). El build los usa para el sitemap y el prerender del catálogo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, traducciones y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:ui
      - run: npm test

  build-e2e:
    name: Build y smoke e2e
    runs-on: ubuntu-latest
    needs: checks
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
